name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Read project version
        id: project
        shell: bash
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify tag matches project version
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "v${PROJECT_VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${PROJECT_VERSION}." >&2
            exit 1
          fi

      - name: Test against Velocity 4 API
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dvelocity.api.version=4.0.0
          clean test

      - name: Build release JAR against Velocity 3 API
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Create checksum
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
        working-directory: target
        shell: bash
        run: >-
          sha256sum "velocity-stay-server-${PROJECT_VERSION}.jar"
          > "velocity-stay-server-${PROJECT_VERSION}.jar.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "target/velocity-stay-server-${PROJECT_VERSION}.jar" \
            "target/velocity-stay-server-${PROJECT_VERSION}.jar.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Velocity Stay Server ${PROJECT_VERSION}"
