version: 2

updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    labels:
      - dependencies
    ignore:
      # 3.0.0 is the intentional binary-compatibility floor for one v3/v4 JAR.
      - dependency-name: com.velocitypowered:velocity-api
    groups:
      maven-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
